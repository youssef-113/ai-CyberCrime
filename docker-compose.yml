services:
  # API Gateway / Orchestrator
  api-gateway:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      - OCR_SERVICE_URL=http://ocr:8001
      - CLASSIFIER_SERVICE_URL=http://classifier:8002
      - RAG_SERVICE_URL=http://rag:8003
      - VERIFICATION_SERVICE_URL=http://verification:8004
      - PDF_SERVICE_URL=http://pdf-gen:8005
      - CHATBOT_SERVICE_URL=http://chatbot:8006
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - ./outputs:/outputs
    depends_on:
      - ocr
      - classifier
      - rag
      - verification
      - pdf-gen

  # Stage 2: OCR & Entity Extraction
  ocr:
    build: ./services/ocr
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/data

  # Stage 3a: Crime Classification
  classifier:
    build: ./services/classifier
    ports:
      - "8002:8002"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-3-haiku-20240307}

  # Stage 3b: Legal Retrieval (RAG) - Production Pipeline
  rag:
    build: ./services/rag
    ports:
      - "8003:8003"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-3-haiku-20240307}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - ARTICLES_PATH=/data/law/articles.json
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-true}
      - MULTI_TENANT_ENABLED=${MULTI_TENANT_ENABLED:-true}
      - HYDE_ENABLED=${HYDE_ENABLED:-true}
      - RAG_FUSION_ENABLED=${RAG_FUSION_ENABLED:-true}
    volumes:
      - ./data/law:/data/law
    depends_on:
      - qdrant
      - redis
      - ollama

  # RAG Ingestion Worker (Celery - async pipeline)
  rag-worker:
    build: ./services/rag
    command: ["celery", "-A", "ingestion:celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "ingestion"]
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ARTICLES_PATH=/data/law/articles.json
    volumes:
      - ./data/law:/data/law
    depends_on:
      - redis
      - qdrant

  # Stage 4: Multi-Agent Verification
  verification:
    build: ./services/verification
    ports:
      - "8004:8004"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  # Stage 5: PDF Generation
  pdf-gen:
    build: ./services/pdf_gen
    ports:
      - "8005:8005"
    volumes:
      - ./outputs:/outputs

  # Frontend React App
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api-gateway:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway

  # Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Chatbot Service (Legal AI Assistant)
  chatbot:
    build: ./services/chatbot
    ports:
      - "8006:8006"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - ollama

  # Ollama - Local LLM Inference
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh
    command: ["/entrypoint.sh"]
    # GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Redis (Cache + Celery Broker)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  qdrant_storage:
  redis_data:
  ollama_data:
