services:

  # ══════════════════════════════════════════════════════════════════════════
  #  Backend API (slim FastAPI) — port 8000
  # ══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - MAX_UPLOAD_SIZE_BYTES=10485760
      - MAX_UPLOAD_FILES=5
      - MAX_REQUEST_SIZE_BYTES=10485760
      - MAX_JSON_PAYLOAD_SIZE=1048576
      - MAX_OCR_TIMEOUT=30
      - MAX_OCR_PAGES=20
    volumes:
      - ./outputs:/outputs
      - ./data:/data
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  #  Backend Celery Worker (full ML stack)
  # ══════════════════════════════════════════════════════════════════════════
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: >
      celery -A services.common.celery_app worker --loglevel=info --concurrency=2 -Q ocr,rag,classifier,default --hostname=backend-worker@%h
    env_file: .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./outputs:/outputs
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  #  Frontend (React + Vite) — port 3000
  # ══════════════════════════════════════════════════════════════════════════
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  #  Infrastructure
  # ══════════════════════════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:11434/api/tags" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  redis_data:
  ollama_data:

