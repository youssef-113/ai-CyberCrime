services:
  # API Gateway / Orchestrator
  api-gateway:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      - OCR_SERVICE_URL=http://ocr:8001
      - CLASSIFIER_SERVICE_URL=http://classifier:8002
      - RAG_SERVICE_URL=http://rag:8003
      - VERIFICATION_SERVICE_URL=http://verification:8004
      - PDF_SERVICE_URL=http://pdf-gen:8005
      - CHATBOT_SERVICE_URL=http://chatbot:8006
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - ./outputs:/outputs
    depends_on:
      - ocr
      - classifier
      - rag
      - verification
      - pdf-gen

  # OCR
  ocr:
    build: ./services/ocr
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data

  # Classifier
  classifier:
    build: ./services/classifier
    ports:
      - "8002:8002"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  # RAG (Chroma)
  rag:
    build: ./services/rag
    ports:
      - "8003:8003"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=egyptian_law
      - EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - OLLAMA_TIMEOUT=180
      - RERANKER_ENABLED=true
      - ARTICLES_PATH=/data/law/articles.json
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=50
      - PARENT_CHUNK_SIZE=1600
    volumes:
      - ./data/law:/data/law
    depends_on:
      - redis
      - ollama
      - chromadb

  # RAG Worker
  rag-worker:
    build: ./services/rag
    command: ["celery", "-A", "ingestion", "worker", "--loglevel=info"]
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=egyptian_law
      - EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - REDIS_URL=redis://redis:6379/0
      - RERANKER_ENABLED=true
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=50
      - PARENT_CHUNK_SIZE=1600
    volumes:
      - ./data/law:/data/law
    depends_on:
      - redis
      - chromadb

  # Verification
  verification:
    build: ./services/verification
    ports:
      - "8004:8004"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  # PDF Generator
  pdf-gen:
    build: ./services/pdf_gen
    ports:
      - "8005:8005"
    volumes:
      - ./outputs:/outputs

  # Chatbot
  chatbot:
    build: ./services/chatbot
    ports:
      - "8006:8006"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api-gateway:8000
    depends_on:
      - api-gateway

  # ChromaDB
  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8007:8000"
    volumes:
      - law_db:/chroma/chroma

  # Ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  ollama_data:
  law_db: