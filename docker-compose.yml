services:
  # API Gateway / Orchestrator
  api-gateway:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      - OCR_SERVICE_URL=http://ocr:8001
      - CLASSIFIER_SERVICE_URL=http://classifier:8002
      - RAG_SERVICE_URL=http://rag:8003
      - VERIFICATION_SERVICE_URL=http://verification:8004
      - PDF_SERVICE_URL=http://pdf-gen:8005
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - ./outputs:/outputs
    depends_on:
      - ocr
      - classifier
      - rag
      - verification
      - pdf-gen

  # Stage 2: OCR & Entity Extraction
  ocr:
    build: ./services/ocr
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/data

  # Stage 3a: Crime Classification
  classifier:
    build: ./services/classifier
    ports:
      - "8002:8002"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-3-haiku-20240307}

  # Stage 3b: Legal Retrieval (RAG)
  rag:
    build: ./services/rag
    ports:
      - "8003:8003"
    volumes:
      - ./data/law_db:/data/law_db
      - ./data/law/parsed:/data/law/parsed

  # Stage 4: Multi-Agent Verification
  verification:
    build: ./services/verification
    ports:
      - "8004:8004"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  # Stage 5: PDF Generation
  pdf-gen:
    build: ./services/pdf_gen
    ports:
      - "8005:8005"
    volumes:
      - ./outputs:/outputs

  # Frontend React App
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api-gateway:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
