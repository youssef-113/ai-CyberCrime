name: CI - Test All Services

on:
  push:
    branches: [ main, develop, Frontend ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-services:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r services/api/requirements.txt
        pip install -r services/ocr/requirements.txt
        pip install -r services/classifier/requirements.txt
        pip install -r services/rag/requirements.txt
        pip install -r services/verification/requirements.txt
        pip install -r services/pdf_gen/requirements.txt
        pip install pytest pytest-asyncio httpx
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-key' }}
    
  docker-build:
    runs-on: ubuntu-latest
    needs: test-services
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build all services
      run: |
        docker-compose build
    
    - name: Start services
      run: |
        docker-compose up -d
        sleep 30  # Wait for services to start
    
    - name: Health check
      run: |
        chmod +x scripts/verify-all.sh
        ./scripts/verify-all.sh
    
    - name: Stop services
      if: always()
      run: |
        docker-compose down
