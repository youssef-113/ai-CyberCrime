name: CI - Build, Test & Push

on:
  push:
    branches: [ main, develop, Frontend ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ── Frontend: install, lint, build ──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Docker build frontend
        run: docker build -t aceb-frontend:ci .

      - name: Save frontend image
        run: docker save aceb-frontend:ci | gzip > /tmp/frontend.tar.gz

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend.tar.gz
          retention-days: 1

  # ── Backend: build Docker image ──
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build --build-arg HF_TOKEN=${{ secrets.HF_TOKEN }} -t aceb-backend:ci -f backend/Dockerfile.api backend

      - name: Save backend image
        run: docker save aceb-backend:ci | gzip > /tmp/backend.tar.gz

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend.tar.gz
          retention-days: 1

  # ── End-to-End tests against real containers ──
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp/

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp/

      - name: Load images
        run: |
          gunzip -c /tmp/backend.tar.gz | docker load
          gunzip -c /tmp/frontend.tar.gz | docker load

      - name: Start services
        run: |
          docker compose -f docker-compose.ci.yml up -d redis
          echo "Waiting for redis..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ai-cybercrime-redis-1 2>/dev/null || echo "starting")
            echo "redis: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            sleep 3
          done
          docker compose -f docker-compose.ci.yml up -d backend
          echo "Waiting for backend..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ai-cybercrime-backend-1 2>/dev/null || echo "starting")
            echo "backend: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            sleep 5
          done
          docker compose -f docker-compose.ci.yml up -d frontend
          sleep 5

      - name: Run E2E tests
        run: |
          pip install httpx
          python3 tests/test_e2e_api.py

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs backend --tail 50
          docker compose -f docker-compose.ci.yml logs frontend --tail 50
          docker compose -f docker-compose.ci.yml ps

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
